<!doctype html>
<html lang="fil"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BatsCityAccess</title>
<meta name="theme-color" content="#0b5ed7">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{
  --bg:#f1f5fb;--card:#fff;--ink:#0f1b2d;--muted:#5a6b80;--line:#e0e7f0;
  --brand:#0a4f9e;--brand-d:#073a77;--brand2:#e6f0fc;--accent:#f59e0b;
  --danger:#d92d20;--danger2:#fdecea;--ok:#12805c;
  --shadow:0 1px 2px rgba(15,27,45,.06),0 6px 18px rgba(15,27,45,.06);
  --r:18px;--fs:16px;
}
:root[data-theme=dark]{
  --bg:#0a1220;--card:#121e33;--ink:#e8eef7;--muted:#9db0c7;--line:#223350;
  --brand:#6cb2ff;--brand-d:#0d2a4d;--brand2:#16304f;--danger:#ff7a6b;--danger2:#3a1b1b;--ok:#3ccf9c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]):not([data-theme=dark]){
    --bg:#0a1220;--card:#121e33;--ink:#e8eef7;--muted:#9db0c7;--line:#223350;
    --brand:#6cb2ff;--brand-d:#0d2a4d;--brand2:#16304f;--danger:#ff7a6b;--danger2:#3a1b1b;--ok:#3ccf9c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--brand)}
.app{max-width:560px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:84px}
svg.i{width:1.35em;height:1.35em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.top{background:linear-gradient(160deg,var(--brand-d),var(--brand) 140%);color:#fff;padding:14px 16px 56px;border-radius:0 0 28px 28px}
:root[data-theme=dark] .top{background:linear-gradient(160deg,#0a2140,#12427a)}
.bar{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.bar h1{font-size:1.1rem;margin:0;line-height:1.15}
.bar small{display:block;opacity:.85;font-size:.72rem;font-weight:400}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;padding:7px 11px;font-size:.78rem}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80}
.off .dot{background:#fbbf24}
.hello{margin:16px 2px 0;font-size:1.35rem;font-weight:700}
.hello small{display:block;font-size:.85rem;font-weight:400;opacity:.88}
.offbanner{margin:12px 16px 0;padding:10px 12px;border-radius:12px;background:#fff4d6;color:#6b4a00;font-size:.85rem;display:none}
.offline .offbanner{display:block}

/* search */
.sbox{margin:-30px 16px 0;position:relative;z-index:2;background:var(--card);border-radius:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;padding:0 14px}
.sbox input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;padding:15px 0;outline:none;min-width:0}
.sbox svg{color:var(--muted)}

main{padding:16px 16px 0}
h2.sec{font-size:1.02rem;margin:22px 2px 10px;display:flex;align-items:center;gap:8px}
h2.sec a,h2.sec button{margin-left:auto;font-size:.82rem;font-weight:500;background:none;border:0;color:var(--brand);padding:0}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}

/* weather mini */
.wmini{display:flex;align-items:center;gap:14px;padding:14px 16px;border:0;width:100%;text-align:left;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.wmini .big{font-size:2rem;font-weight:700;line-height:1}
.wmini .sub{color:var(--muted);font-size:.85rem}
.wmini svg.i{width:2.6rem;height:2.6rem;color:var(--accent)}

/* emergency strip */
.sos{background:linear-gradient(135deg,#b42318,#e5484d);color:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.sos h3{margin:0 0 10px;font-size:1rem;display:flex;gap:8px;align-items:center}
.hs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px}
.hs::-webkit-scrollbar{display:none}
.call{flex:none;display:flex;flex-direction:column;gap:2px;background:rgba(255,255,255,.18);color:#fff;text-decoration:none;border-radius:14px;padding:10px 13px;min-width:130px}
.call b{font-size:1rem}.call span{font-size:.72rem;opacity:.9}

/* tiles */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;padding:2px 0;color:var(--ink);font-size:.72rem;text-align:center;line-height:1.2}
.tile i{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--c);box-shadow:var(--shadow)}
.tile svg.i{width:26px;height:26px}

/* announcements carousel */
.news{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 10px;scrollbar-width:none}
.news::-webkit-scrollbar{display:none}
.nc{scroll-snap-align:start;flex:none;width:82%;max-width:300px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:6px}
.nc h4{margin:0;font-size:.95rem;line-height:1.3}
.nc p{margin:0;font-size:.82rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--brand2);color:var(--brand);align-self:flex-start}
.tag.advisory{background:var(--danger2);color:var(--danger)}
.tag.event{background:#fff1d6;color:#9a5b00}
:root[data-theme=dark] .tag.event{background:#3a2c0e;color:#f5b84a}
.date{font-size:.74rem;color:var(--muted)}
.nlink{font-size:.82rem;margin-top:auto}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:3}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:.85rem;display:flex;gap:6px;align-items:center}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme=dark] .chip[aria-pressed=true]{color:#06182e}
.count{font-size:.8rem;color:var(--muted);margin:10px 4px}

/* item card */
.it{border-left:5px solid var(--c)}
.it .hd{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:14px 14px 10px}
.it .ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--c);flex:none}
.it h4{margin:0;font-size:.98rem;line-height:1.3}
.it .s{margin:3px 0 0;font-size:.85rem;color:var(--muted)}
.it .chev{margin-left:auto;color:var(--muted);transition:transform .2s;flex:none;margin-top:6px}
.it.open .chev{transform:rotate(180deg)}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 14px}
.btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:12px;padding:9px 13px;font-size:.85rem;font-weight:600;text-decoration:none;background:var(--brand2);color:var(--brand)}
.btn.p{background:var(--brand);color:#fff}
:root[data-theme=dark] .btn.p{color:#06182e}
.btn.d{background:var(--danger);color:#fff}
:root[data-theme=dark] .btn.d{color:#2a0a07}
.btn.on{background:var(--accent);color:#2b1a00}
.det{display:none;padding:0 14px 14px;font-size:.9rem;border-top:1px dashed var(--line)}
.it.open .det{display:block}
.det h5{margin:14px 0 4px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.det ul{margin:0;padding-left:18px}.det li{margin:3px 0}
.srcl{margin-top:12px;font-size:.74rem;color:var(--muted)}

/* weather view */
.wnow{background:linear-gradient(150deg,#1d6fd1,#0a4f9e);color:#fff;border-radius:24px;padding:20px;box-shadow:var(--shadow)}
:root[data-theme=dark] .wnow{background:linear-gradient(150deg,#12427a,#0a2140)}
.wnow .row{display:flex;align-items:center;gap:14px}
.wnow .t{font-size:3.4rem;font-weight:700;line-height:1}
.wnow svg.i{width:4rem;height:4rem;color:#ffd666}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stats div{background:rgba(255,255,255,.14);border-radius:12px;padding:8px;text-align:center;font-size:.78rem}
.stats b{display:block;font-size:.98rem}
.fc{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.fc div{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px 4px;text-align:center;font-size:.75rem}
.fc svg.i{width:1.7rem;height:1.7rem;color:var(--accent);display:block;margin:4px auto}
.fc b{font-size:.85rem}
.tip{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--brand2);color:var(--brand);font-size:.85rem}
.note{font-size:.8rem;color:var(--muted);margin:8px 2px}

/* lists in menu */
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);width:100%;border-left:0;border-right:0;border-top:0;background:none;text-align:left}
.row:last-child{border-bottom:0}
.row .sp{flex:1}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:7px 11px;border-radius:9px;font-size:.82rem}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:var(--shadow);font-weight:700}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
[aria-checked=true] .radio{border-color:var(--brand)}
[aria-checked=true] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand)}

/* sheet + toast */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:30}
.sheet.show{display:flex}
.sheet .box{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:8px 0 24px}
.sheet h3{margin:12px 20px 6px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#14202e;color:#fff;padding:10px 16px;border-radius:12px;font-size:.88rem;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:90vw;text-align:center}
.toast.show{opacity:1}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;pointer-events:none}
.tabs nav{pointer-events:auto;width:100%;max-width:560px;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(15,27,45,.08)}
.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.66rem;color:var(--muted);padding:6px 2px;border-radius:12px}
.tabs button svg.i{width:23px;height:23px}
.tabs button[aria-current=page]{color:var(--brand)}
.tabs button.sosb{color:var(--danger)}
.tabs button.sosb svg{background:var(--danger);color:#fff;border-radius:50%;padding:6px;width:36px;height:36px;margin-top:-16px;box-shadow:0 4px 12px rgba(217,45,32,.45)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.foot{font-size:.74rem;color:var(--muted);padding:6px 4px 20px}

function matchItem(it) {
  if (S.cat === 'saved') { if (S.saved.indexOf(it.id) < 0) return false; }
  else if (S.cat !== 'all' && S.cat !== 'news' && it.cat !== S.cat) return false;
  if (!S.q) return true;
  const hay = [JSON.stringify(it.t), JSON.stringify(it.s || ''), it.o || '', (it.c || []).join(' '), it.k || '', JSON.stringify(it.d || ''), JSON.stringify(it.r || '')].join(' ').toLowerCase();

}

// ---------- weather ----------
const WGRP = (c) => c <= 1 ? 0 : c === 2 ? 1 : c === 3 ? 2 : (c === 45 || c === 48) ? 3 : (c >= 51 && c <= 57) ? 4 : (c >= 61 && c <= 67) ? 5 : (c >= 80 && c <= 82) ? 6 : c >= 95 ? 7 : 2;
const WICON = ['sun', 'cloudsun', 'cloud', 'fog', 'rain', 'rain', 'rain', 'storm'];
function loadWx(lat, lon, label) {
  S.wxBusy = true; paintWx();
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
    '&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FManila&forecast_days=5';
  const ctl = ('AbortController' in window) ? new AbortController() : null;
  const to = setTimeout(() => ctl && ctl.abort(), 9000);
  return fetch(url, ctl ? { signal: ctl.signal } : {}).then((r) => { if (!r.ok) throw new Error('http'); return r.json(); })
    .then((j) => {
      S.wx = { t: Date.now(), label: label, cur: j.current, daily: j.daily };
      LS.set('wx', S.wx); S.wxMsg = '';
    })
    .catch(() => { S.wxMsg = S.wx ? 'wcache' : 'wfail'; })
    .then(() => { clearTimeout(to); S.wxBusy = false; paintWx(); if (S.route === 'home') paintHome(); });
}
function useMyLocation() {
  if (!navigator.geolocation) { S.wxMsg = 'locno'; return loadWx(S.data.meta.city.lat, S.data.meta.city.lon, 'city'); }
  S.wxMsg = 'locating'; paintWx();
  navigator.geolocation.getCurrentPosition((p) => {
    S.loc = { lat: p.coords.latitude, lon: p.coords.longitude };
    loadWx(S.loc.lat, S.loc.lon, 'me');
  }, () => { S.wxMsg = 'locno'; loadWx(S.data.meta.city.lat, S.data.meta.city.lon, 'city'); }, { timeout: 9000, maximumAge: 600000 });
}
function wxHtml() {
  const w = S.wx;
  if (!w) return '<div class="card" style="padding:18px">' + (S.wxBusy ? '…' : esc(T('wfail'))) + '</div>';
  const c = w.cur, g = WGRP(c.weather_code), rain = w.daily.precipitation_probability_max[0];
  const where = w.label === 'me' ? T('myloc').replace(/^.*?(Maps|Mapa).*$/, '') : '';
  let h = '<div class="wnow"><div class="row" style="border:0;padding:0">' + ic(WICON[g]) + '<div><div class="t">' + Math.round(c.temperature_2m) + '°C</div><div>' + esc(T('wc' + g)) + '</div></div></div>' +
    '<div class="stats"><div><b>' + Math.round(c.apparent_temperature) + '°</b>' + esc(T('feels')) + '</div><div><b>' + Math.round(c.relative_humidity_2m) + '%</b>' + esc(T('hum')) + '</div><div><b>' + Math.round(c.wind_speed_10m) + ' km/h</b>' + esc(T('wind')) + '</div></div></div>';
  if (rain >= 60) h += '<div class="tip">' + ic('info') + ' ' + esc(T('raintip')) + ' (' + rain + '%)</div>';
  h += '<h2 class="sec">' + esc(T('fc')) + '</h2><div class="fc">' + w.daily.time.map((d, i) => {
    let day = d; try { day = new Date(d + 'T00:00:00').toLocaleDateString(S.lang === 'en' ? 'en-PH' : 'fil-PH', { weekday: 'short' }); } catch (e) {}
    return '<div><span>' + esc(day) + '</span>' + ic(WICON[WGRP(w.daily.weather_code[i])]) + '<b>' + Math.round(w.daily.temperature_2m_max[i]) + '°</b><br><span>' + Math.round(w.daily.temperature_2m_min[i]) + '°</span><br><span>' + (w.daily.precipitation_probability_max[i] || 0) + '%</span></div>';
  }).join('') + '</div>';
  const when = new Date(w.t).toLocaleString(S.lang === 'en' ? 'en-PH' : 'fil-PH', { dateStyle: 'medium', timeStyle: 'short' });
  h += '<p class="note">' + esc(T('upd')) + ': ' + esc(when) + ' &middot; Open-Meteo' + (S.wxMsg === 'wcache' ? ' &middot; ' + esc(T('wcache')) : '') + '</p>';

  const titles = { info: T('info'), sos: T('sos'), wx: T('wx'), menu: T('menu') };
  const hr = new Date().getHours(), g = hr < 12 ? 'gm' : hr < 18 ? 'ga' : 'ge';
  return '<div class="top" ' + (S.route === 'info' || home ? '' : 'style="padding-bottom:22px"') + '><div class="bar"><span class="logo">' + ic('pin') + '</span><div><h1>' + esc(S.data.meta.appName) + '<small>' + esc(T('tagline')) + '</small></h1></div><span class="sp"></span>' +
    '<button class="pill ' + (on ? '' : 'off') + '" data-act="net"><span class="dot"></span>' + esc(on ? T('online') : T('offline')) + '</button>' +
    '<button class="pill" data-act="lang">' + ic('globe') + S.lang.toUpperCase() + '</button></div>' +
    (home ? '<div class="hello">' + esc(T(g)) + '!<small>Batangas City</small></div>' : '<div class="hello">' + esc(titles[S.route] || '') + '</div>') + '</div>' +
    '<div class="offbanner">' + esc(T('offnote')) + '</div>';
}
function sbox(id, val) { return '<div class="sbox">' + ic('search') + '<input id="' + id + '" type="search" enterkeyhint="search" autocomplete="off" placeholder="' + esc(T('search')) + '" value="' + esc(val || '') + '"></div>'; }
function homeBody() {
  const d = S.data, w = S.wx;
  let wm = '<button class="wmini" data-go="wx">';
  if (w) { const g = WGRP(w.cur.weather_code); wm += ic(WICON[g]) + '<div><div class="big">' + Math.round(w.cur.temperature_2m) + '°C</div><div class="sub">' + esc(T('wc' + g)) + ' &middot; ' + esc(T('rain')) + ' ' + (w.daily.precipitation_probability_max[0] || 0) + '%</div></div>'; }
  else wm += ic('cloudsun') + '<div><div class="big" style="font-size:1.1rem">' + esc(T('w')) + '</div><div class="sub">Batangas City</div></div>';
  wm += '<span class="sp"></span>' + ic('chev', '') + '</button>';
  const sos = d.items.filter((i) => i.cat === 'emergency' && i.pri).slice(0, 6).map((i) => '<a class="call" href="' + esc(tel(i.c[0])) + '"><b>' + esc(i.c[0]) + '</b><span>' + esc(L(i.t)) + '</span></a>').join('');
  const tiles = d.categories.map((c) => ({ go: c.id === 'emergency' ? 'sos' : 'info/' + c.id, ic: c.ic, l: catLabel(c.id), col: CATCOL[c.id] }))
    .concat([{ go: 'wx', ic: 'cloudsun', l: T('w'), col: '#1d8ae0' }, { go: 'wx/map', ic: 'navigation', l: T('dir'), col: '#0f9b72' }, { go: 'info/news', ic: 'bell', l: T('news'), col: '#e08a00' }, { go: 'info/saved', ic: 'bookmark', l: T('mysaved'), col: '#d6336c' }]);
  const news = d.announcements.slice().sort((a, b) => b.date < a.date ? -1 : 1).slice(0, 4).map((n) => newsCard(n)).join('');
  const pop = d.items.filter((i) => i.pri && i.cat !== 'emergency').slice(0, 6).map(itemCard).join('');
  return '<main id="homebox"><div style="margin-top:6px">' + wm + '</div>' +
    '<h2 class="sec" style="margin-top:18px"> </h2><div class="sos" style="margin-top:-30px"><h3>' + ic('alert') + esc(T('help')) + '</h3><div class="hs">' + sos + '</div></div>' +
    '<h2 class="sec">' + esc(T('quick')) + '</h2><div class="grid">' + tiles.map((t) => '<button class="tile" data-go="' + t.go + '" style="--c:' + t.col + '"><i>' + ic(t.ic) + '</i>' + esc(t.l) + '</button>').join('') + '</div>' +
    '<h2 class="sec">' + ic('bell') + esc(T('news')) + '<button data-go="info/news">' + esc(T('seeall')) + '</button></h2><div class="news">' + news + '</div>' +
    '<h2 class="sec">' + esc(T('ready')) + '</h2>' + pop + '<p class="foot">' + esc(T('abouttxt')) + '</p></main>';
}
function paintHome() { const el = $('#homebox'); if (el) { const m = homeBody(); const t = document.createElement('div'); t.innerHTML = m; el.innerHTML = t.firstChild.innerHTML; } }
function listHtml() {
  const d = S.data;
  if (S.cat === 'news') {
    const ns = d.announcements.slice().sort((a, b) => b.date < a.date ? -1 : 1).filter((n) => !S.q || JSON.stringify(n).toLowerCase().indexOf(S.q.toLowerCase()) > -1);
    return '<p class="count">' + ns.length + ' ' + esc(T('res')) + '</p>' + (ns.map((n) => '<div style="margin-bottom:12px" class="nc">' + newsCard(n, true).replace(/^<article class="nc">/, '').replace(/<\/article>$/, '') + '</div>').join('') || '<div class="empty">' + esc(T('none')) + '</div>');
  }
  const items = d.items.filter(matchItem);
  if (S.cat === 'saved' && !S.saved.length) return '<div class="empty">' + esc(T('nosaved')) + '</div>';
  return '<p class="count">' + items.length + ' ' + esc(T('res')) + '</p>' + (items.map(itemCard).join('') || '<div class="empty">' + esc(T('none')) + '</div>');
}
function infoBody() {
  const d = S.data;
  const chip = (id, l, icn) => '<button class="chip" data-cat="' + id + '" aria-pressed="' + (S.cat === id) + '">' + (icn ? ic(icn) : '') + esc(l) + '</button>';
  return sbox('q', S.q) + '<div class="chips">' + chip('all', T('all')) + chip('news', T('news'), 'bell') + chip('saved', T('mysaved'), 'bookmark') + d.categories.map((c) => chip(c.id, catLabel(c.id), c.ic)).join('') + '</div><main id="list">' + listHtml() + '</main>';
}
function sosBody() {
  const d = S.data, its = d.items.filter((i) => i.cat === 'emergency').sort((a, b) => (b.pri || 0) - (a.pri || 0));
  const tips = d.tips.map((t) => {
    const k = 'tip_' + t.id, open = S.open[k] ? ' open' : '';
    return '<article class="card it' + open + '" style="--c:#d92d20"><button class="hd" data-open="' + k + '"><span class="ico">' + ic(t.ic) + '</span><span><h4>' + esc(L(t.t)) + '</h4></span><span class="chev">' + ic('chev') + '</span></button><div class="det"><ul>' + LL(t.d).map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul></div></article>';
  }).join('');
  return '<main><p class="note" style="margin-top:0">' + esc(T('hint')) + '</p>' + its.map(itemCard).join('') + '<h2 class="sec">' + ic('shield') + esc(T('tips')) + '</h2>' + tips + '</main>';
}
function wxBody() {
  const places = S.data.items.filter((i) => i.m && i.cat !== 'emergency').slice(0, 14);
  const links = S.data.meta.links;
  const myl = S.loc ? 'https://www.google.com/maps/search/?api=1&query=' + S.loc.lat + ',' + S.loc.lon : '';
  return '<main><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button class="btn p" data-act="loc">' + ic('pin') + esc(T('useloc')) + '</button>' +
    '<button class="btn" data-act="city">Batangas City</button><a class="btn" target="_blank" rel="noopener" href="' + esc(links.pagasa) + '">PAGASA</a><a class="btn" target="_blank" rel="noopener" href="' + esc(links.phivolcs) + '">PHIVOLCS</a></div>' +
    '<div id="wxbox">' + wxHtml() + '</div>' +
    '<h2 class="sec" id="map">' + ic('navigation') + esc(T('mapt')) + '</h2><p class="note" style="margin-top:-4px">' + esc(T('mapn')) + '</p>' +
    (myl ? '<a class="btn p" target="_blank" rel="noopener" href="' + esc(myl) + '" style="margin-bottom:12px">' + ic('pin') + esc(T('myloc')) + '</a>' : '') +
    '<h2 class="sec" style="font-size:.9rem;color:var(--muted)">' + esc(T('places')) + '</h2>' +
    places.map((i) => '<div class="card"><div class="row" style="border:0"><span class="ico" style="width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--brand2);color:var(--brand)">' + ic(i.ic || 'pin') + '</span><div class="sp"><b style="font-size:.9rem">' + esc(L(i.t)) + '</b></div><a class="btn p" target="_blank" rel="noopener" href="' + esc(dirUrl(i.m)) + '">' + ic('navigation') + esc(T('dir')) + '</a></div></div>').join('') + '</main>';
}
function menuBody() {
  const m = S.data.meta, seg = (items, cur, act) => '<div class="seg">' + items.map((x) => '<button data-act="' + act + '" data-v="' + x[0] + '" aria-pressed="' + (String(cur) === String(x[0])) + '">' + esc(x[1]) + '</button>').join('') + '</div>';
  return '<main><h2 class="sec" style="margin-top:4px">' + ic('globe') + esc(T('lang')) + '</h2><div class="card">' +
    LANGS.map((l) => '<button class="row" role="radio" aria-checked="' + (S.lang === l.code) + '" data-setlang="' + l.code + '"><span class="radio"></span><span class="sp">' + esc(l.name) + '</span></button>').join('') + '</div><p class="note">' + esc(T('langnote')) + '</p>' +
    '<div class="card"><div class="row"><span class="sp">' + esc(T('theme')) + '</span>' + seg([['auto', T('auto')], ['light', T('light')], ['dark', T('dark')]], S.theme, 'theme') + '</div>' +
    '<div class="row"><span class="sp">' + esc(T('size')) + '</span>' + seg([[0, 'A-'], [1, 'A'], [2, 'A+']], S.size, 'size') + '</div></div>' +
    '<div class="card"><button class="row" data-go="info/saved">' + ic('bookmark') + '<span class="sp">' + esc(T('mysaved')) + ' (' + S.saved.length + ')</span></button>' +
    '<button class="row" data-act="update">' + ic('refresh') + '<span class="sp">' + esc(T('chk')) + '<br><small style="color:var(--muted)">' + esc(T('upd')) + ': ' + esc(m.updated) + ' &middot; v' + esc(m.version) + '</small></span></button>' +
    (deferredPrompt ? '<button class="row" data-act="install">' + ic('download') + '<span class="sp">' + esc(T('install')) + '</span></button>' : '') + '</div>' +
    '<h2 class="sec">' + ic('info') + esc(T('about')) + '</h2><p class="note">' + esc(T('abouttxt')) + '</p><p class="note">' + esc(m.city.hall) + '<br>' + esc(m.city.phone) + ' &middot; <a href="' + esc(m.city.website) + '" target="_blank" rel="noopener">batangascity.gov.ph</a></p></main>';
}
const TABS = [['home', 'home', 'home'], ['info', 'list', 'info'], ['sos', 'alert', 'sos'], ['wx', 'cloudsun', 'wx'], ['menu', 'menu', 'menu']];
function render() {
  if (!S.data) { $('#root').innerHTML = '<div class="empty" style="padding-top:30vh">…</div>'; return; }
  document.documentElement.lang = S.lang;
  const body = { home: () => sbox('hq') + homeBody(), info: infoBody, sos: sosBody, wx: wxBody, menu: menuBody }[S.route]();
  $('#root').innerHTML = '<div class="app' + (navigator.onLine ? '' : ' offline') + '">' + topHtml() + body + '</div>' +
    '<div class="tabs"><nav>' + TABS.map((t) => '<button class="' + (t[0] === 'sos' ? 'sosb' : '') + '" data-go="' + t[0] + '" ' + (S.route === t[0] ? 'aria-current="page"' : '') + '>' + ic(t[1]) + '<span>' + esc(T(t[2])) + '</span></button>').join('') + '</nav></div>';
  if (S.route === 'wx' && !S.wx && !S.wxBusy) refreshWx();
}
// ---------- data sync ----------
function applyData(d, manual) {
  const cur = S.data;
  const changed = !cur || d.meta.version !== cur.meta.version || d.meta.updated !== cur.meta.updated || JSON.stringify(d.items) !== JSON.stringify(cur.items) || JSON.stringify(d.announcements) !== JSON.stringify(cur.announcements);
  S.data = d; LS.set('data', d);
  if (changed) { render(); if (cur) toast(T('done')); } else if (manual) toast(T('uptodate'));
}
function loadData(manual) {
  return fetch('data.json?t=' + Date.now(), { cache: 'no-store' }).then((r) => { if (!r.ok) throw new Error('http'); return r.json(); })
    .then((d) => { if (!d || !Array.isArray(d.items) || !d.meta) throw new Error('bad'); applyData(d, manual); })
    .catch((e) => { if (manual) toast(T('fail')); if (!S.data) return caches.match('data.json').then((r) => r && r.json()).then((d) => { if (d) { S.data = d; render(); } }).catch(() => {}); });
}
function refreshWx() { const c = S.data.meta.city; return S.loc ? loadWx(S.loc.lat, S.loc.lon, 'me') : loadWx(c.lat, c.lon, 'city'); }
// ---------- routing & events ----------
function route() {
  const p = (location.hash || '#/home').replace(/^#\/?/, '').split('/');
  S.route = ['home', 'info', 'sos', 'wx', 'menu'].indexOf(p[0]) > -1 ? p[0] : 'home';
  if (S.route === 'info') { S.cat = p[1] || 'all'; } else if (S.route === 'wx') { S.sub = p[1]; }
  render();
  if (S.route === 'wx' && S.sub === 'map') { const m = $('#map'); if (m) m.scrollIntoView(); } else window.scrollTo(0, 0);
}
const go = (r) => { location.hash = '#/' + r; };
function applyPrefs() {
  if (S.theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', S.theme);
  document.documentElement.style.setProperty('--fs', [15, 16.5, 18][S.size] + 'px');
}
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; if (S.route === 'menu') render(); });
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-go],[data-open],[data-save],[data-share],[data-act],[data-cat],[data-setlang]');
  if (!t) return;
  if (t.dataset.go) { go(t.dataset.go); return; }
  if (t.dataset.cat) { S.cat = t.dataset.cat; history.replaceState(null, '', '#/info/' + S.cat); render(); return; }
  if (t.dataset.open) { const k = t.dataset.open; S.open[k] = !S.open[k]; const c = t.closest('.card'); c.classList.toggle('open', !!S.open[k]); t.setAttribute('aria-expanded', !!S.open[k]); return; }
  if (t.dataset.save) { const id = t.dataset.save, i = S.saved.indexOf(id); if (i > -1) S.saved.splice(i, 1); else S.saved.push(id); LS.set('saved', S.saved); const keep = window.scrollY; render(); window.scrollTo(0, keep); return; }
  if (t.dataset.share) {
    const it = S.data.items.find((x) => x.id === t.dataset.share), txt = L(it.t) + (it.c ? ' ' + it.c[0] : '');
    if (navigator.share) navigator.share({ title: L(it.t), text: txt, url: location.href.split('#')[0] }).catch(() => {});
    else if (navigator.clipboard) navigator.clipboard.writeText(txt + ' ' + location.href.split('#')[0]).then(() => toast(T('copied'))).catch(() => {});
    return;
  }
  if (t.dataset.setlang) { S.lang = t.dataset.setlang; LS.set('lang', S.lang); $('#sheet').classList.remove('show'); render(); return; }
  const a = t.dataset.act;
  if (a === 'lang') { openLangSheet(); }
  else if (a === 'net') { toast(navigator.onLine ? T('online') : T('offnote')); }
  else if (a === 'loc') { useMyLocation(); }
  else if (a === 'city') { S.loc = null; S.wxMsg = ''; refreshWx(); }
  else if (a === 'update') { if (!navigator.onLine) { toast(T('fail')); return; } loadData(true); }
  else if (a === 'theme') { S.theme = t.dataset.v; LS.set('theme', S.theme); applyPrefs(); render(); }
  else if (a === 'size') { S.size = +t.dataset.v; LS.set('size', S.size); applyPrefs(); render(); }
  else if (a === 'install' && deferredPrompt) { deferredPrompt.prompt(); deferredPrompt.userChoice.then(() => { deferredPrompt = null; render(); }); }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { S.q = e.target.value.trim(); const l = $('#list'); if (l) l.innerHTML = listHtml(); }
});
document.addEventListener('keydown', (e) => {
  if (e.target.id === 'hq' && e.key === 'Enter') { S.q = e.target.value.trim(); S.cat = 'all'; go('info'); }
});
function openLangSheet() {
  $('#sheet').innerHTML = '<div class="box"><h3>' + esc(T('lang')) + '</h3>' + LANGS.map((l) => '<button class="row" role="radio" aria-checked="' + (S.lang === l.code) + '" data-setlang="' + l.code + '"><span class="radio"></span><span class="sp">' + esc(l.name) + '</span></button>').join('') + '<p class="note" style="padding:0 20px">' + esc(T('langnote')) + '</p></div>';
  $('#sheet').classList.add('show');
}
document.addEventListener('click', (e) => { if (e.target.id === 'sheet') e.target.classList.remove('show'); });
function netUI() { const a = $('.app'); if (a) a.classList.toggle('offline', !navigator.onLine); const p = $('[data-act=net]'); if (p) { p.classList.toggle('off', !navigator.onLine); p.lastChild.textContent = navigator.onLine ? T('online') : T('offline'); } }
window.addEventListener('online', () => { netUI(); loadData(false); if (S.data) refreshWx(); });
window.addEventListener('offline', netUI);
window.addEventListener('hashchange', route);
// ---------- start ----------
applyPrefs();
const cached = LS.get('data', null);
if (cached && cached.meta) S.data = cached;
route();
loadData(false).then(() => { if (S.data) { if (!S.wx || Date.now() - S.wx.t > 30 * 60 * 1000) refreshWx(); } });
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script></body></html>
